<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2F2F7">
<title>Кубышка — прототип</title>
<style>
:root {
  --accent: #15724C;
  --accent-soft: #15724C1A;
  --expense: #B23A2E;
  --income: #15724C;
  --warn: #B07400;
  --bg: #F2F2F7;
  --surface: #FFFFFF;
  --label: #000000;
  --label-2: #3C3C4399;
  --label-3: #3C3C434D;
  --separator: #3C3C431F;
  --fill: #78788014;
  --radius-card: 14px;
  --radius-sheet: 22px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
}

.dark {
  --accent: #35B07A;
  --accent-soft: #35B07A26;
  --expense: #FF7A6B;
  --income: #35B07A;
  --warn: #FFB224;
  --bg: #000000;
  --surface: #1C1C1E;
  --label: #FFFFFF;
  --label-2: #EBEBF599;
  --label-3: #EBEBF54D;
  --separator: #54545899;
  --fill: #7878805C;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: #E8E8ED;
  color: #1C1C1E;
  padding: 40px 24px 80px;
}

.board {
  display: flex;
  flex-wrap: wrap;
  gap: 48px 36px;
  justify-content: center;
  max-width: 1600px;
  margin: 0 auto;
}

.board-title {
  text-align: center;
  margin-bottom: 36px;
}
.board-title h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.board-title p { font-size: 14px; color: #6C6C70; margin-top: 6px; }

figure { display: flex; flex-direction: column; align-items: center; gap: 12px; }
figcaption { font-size: 13px; color: #6C6C70; order: 2; }

.device {
  width: 390px;
  height: 844px;
  border-radius: 46px;
  padding: 10px;
  background: #1C1C1E;
  box-shadow: 0 20px 50px #00000026;
  flex: none;
}

.screen {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 38px;
  overflow: hidden;
  background: var(--bg);
  color: var(--label);
  display: flex;
  flex-direction: column;
  font-size: 17px;
  line-height: 1.3;
}

.status {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 14px 28px 6px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  flex: none;
}
.status span:last-child { font-size: 13px; letter-spacing: 0.08em; }

.body {
  flex: 1;
  overflow: hidden;
  padding: 0 16px;
}

.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 2px 10px;
}
.title-row h2 { font-size: 32px; font-weight: 700; letter-spacing: -0.03em; }

.people { display: flex; }
.people i {
  width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 600; font-style: normal; color: #fff;
  border: 2px solid var(--bg);
}
.people i:nth-child(2) { margin-left: -9px; }

.card {
  background: var(--surface);
  border-radius: var(--radius-card);
  padding: 14px;
  margin-bottom: 10px;
}

.caption { font-size: 13px; color: var(--label-2); }

.amount-xl {
  font-size: 40px;
  font-weight: 700;
  letter-spacing: -0.035em;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
}
.amount-l {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.025em;
  font-variant-numeric: tabular-nums;
}
.delta { font-size: 14px; color: var(--income); margin-top: 4px; font-variant-numeric: tabular-nums; }

.track {
  position: relative;
  height: 8px;
  border-radius: 4px;
  background: var(--fill);
  margin: 14px 0 8px;
  overflow: visible;
}
.track > b { position: absolute; inset: 0 auto 0 0; border-radius: 4px; display: block; }
.track > u {
  position: absolute; top: -4px; bottom: -4px; width: 2px;
  background: var(--label); opacity: 0.35; border-radius: 1px;
}

.row-between { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

.insights { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.insight {
  background: var(--surface);
  border-radius: var(--radius-card);
  padding: 11px 14px;
  border-left: 3px solid var(--warn);
}
.insight.anomaly { border-left-color: var(--accent); }
.insight p { font-size: 14px; line-height: 1.35; margin-top: 4px; color: var(--label-2); }
.insight h4 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }

.list { background: var(--surface); border-radius: var(--radius-card); overflow: hidden; }
.op {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 14px;
  border-top: 0.5px solid var(--separator);
}
.op:first-child { border-top: none; }
.op .ic {
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; font-size: 17px; flex: none;
}
.op .txt { flex: 1; min-width: 0; }
.op .txt b { font-size: 16px; font-weight: 500; letter-spacing: -0.01em; display: block; }
.op .txt span { font-size: 13px; color: var(--label-2); }
.op .sum { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.op .sum.in { color: var(--income); }

.section-head {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 10px 4px 6px;
}
.section-head h3 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.section-head a { font-size: 15px; color: var(--accent); text-decoration: none; }

.tabbar {
  flex: none;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: center;
  padding: 8px 4px 26px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(18px);
  border-top: 0.5px solid var(--separator);
}
.tabbar div {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 10px; color: var(--label-3);
}
.tabbar div.on { color: var(--accent); }
.tabbar div svg { width: 25px; height: 25px; }
.tabbar .fab {
  width: 50px; height: 50px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: grid; place-items: center;
  font-size: 28px; font-weight: 300; line-height: 1;
  margin-top: -14px;
  box-shadow: 0 6px 16px #15724C4D;
}

/* --- Экран ввода --- */
.sheet {
  position: absolute; inset: 44px 0 0;
  background: var(--surface);
  border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
  display: flex; flex-direction: column;
  box-shadow: 0 -10px 40px #00000026;
}
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); margin: 8px auto 10px; }

.segmented {
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--fill); border-radius: 9px; padding: 2px; margin: 0 16px;
  font-size: 14px; font-weight: 500;
}
.segmented span { text-align: center; padding: 6px 0; border-radius: 7px; color: var(--label-2); }
.segmented span.on { background: var(--surface); color: var(--label); box-shadow: 0 1px 3px #0000001f; }

.entry-amount {
  flex: 1;
  display: grid;
  align-content: center;
  text-align: center;
  padding: 0 16px;
}
.entry-amount .value {
  font-size: 56px; font-weight: 700; letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
}
.entry-amount .value i { font-style: normal; color: var(--label-3); }
.entry-amount .meta {
  justify-self: center;
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 10px; padding: 6px 12px; border-radius: 999px;
  background: var(--fill); font-size: 14px; color: var(--label-2);
}

.chips {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  padding: 22px 16px 16px;
}
.chip {
  display: flex; align-items: center; gap: 7px;
  padding: 11px 10px; border-radius: 999px;
  background: var(--fill); font-size: 15px; font-weight: 500; letter-spacing: -0.01em;
  border: none; color: var(--label); font-family: inherit;
}
.chip em { font-style: normal; font-size: 16px; }
.chip.other { background: transparent; border: 1px solid var(--separator); color: var(--label-2); justify-content: center; }

.keypad {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px 12px; padding: 10px 16px 34px;
}
.keypad button {
  height: 50px; border: none; border-radius: 10px;
  background: var(--surface); color: var(--label);
  font-size: 27px; font-weight: 400; font-family: inherit;
  font-variant-numeric: tabular-nums;
}
.keypad button:active { background: var(--fill); }

.toast {
  position: absolute; left: 16px; right: 16px; bottom: 26px;
  background: var(--label); color: var(--bg);
  border-radius: 12px; padding: 13px 16px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 15px; font-weight: 500;
  opacity: 0; transform: translateY(12px);
  transition: opacity .18s ease, transform .18s ease;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }
.toast button {
  background: none; border: none; color: var(--accent);
  font: inherit; font-weight: 600;
}

/* --- Операции --- */
.search {
  display: flex; align-items: center; gap: 7px;
  background: var(--fill); border-radius: 10px;
  padding: 8px 10px; color: var(--label-3); font-size: 17px;
  margin-bottom: 14px;
}
.day-head {
  display: flex; justify-content: space-between;
  padding: 14px 4px 7px;
  font-size: 13px; color: var(--label-2);
  font-variant-numeric: tabular-nums;
}

/* --- Аналитика --- */
.month-nav {
  display: flex; align-items: center; justify-content: center; gap: 22px;
  padding: 6px 0 14px; font-size: 17px; font-weight: 600; letter-spacing: -0.02em;
}
.month-nav b { color: var(--label-3); font-weight: 400; font-size: 22px; }

.totals { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.totals div + div { border-left: 0.5px solid var(--separator); }
.totals strong { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 3px; }

.donut-wrap { display: grid; place-items: center; padding: 6px 0 2px; position: relative; }
.donut-center { position: absolute; text-align: center; }
.donut-center b { font-size: 23px; font-weight: 700; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }

.cat-row {
  display: grid; grid-template-columns: 1fr auto;
  gap: 3px 12px; padding: 9px 14px;
  border-top: 0.5px solid var(--separator);
  align-items: center;
}
.cat-row:first-child { border-top: none; }
.cat-row .name { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 500; }
.cat-row .name i { width: 9px; height: 9px; border-radius: 50%; }
.cat-row .val { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.cat-row .sub { grid-column: 1 / -1; font-size: 13px; color: var(--label-2); padding-left: 18px; }
.cat-row .sub.up { color: var(--expense); }

.bars { display: flex; align-items: flex-end; gap: 7px; height: 92px; padding: 8px 2px 0; }
.bars div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; height: 100%; }
.bars u { display: block; border-radius: 2px; }
.bars span { font-size: 9px; color: var(--label-3); text-align: center; }

.center-stack { display: flex; flex-direction: column; justify-content: center; height: 100%; padding-bottom: 40px; }
.lead { font-size: 15px; color: var(--label-2); line-height: 1.4; }
.form { display: grid; gap: 10px; padding: 18px 0 8px; }
.form input {
  width: 100%; padding: 13px 14px; border-radius: 12px; border: none;
  background: var(--surface); font: inherit; color: var(--label);
}
.primary {
  width: 100%; padding: 14px; border-radius: 12px; border: none;
  background: var(--accent); color: #fff; font-size: 17px; font-weight: 600; font-family: inherit;
}
.quiet { background: none; border: none; color: var(--accent); font-size: 15px; padding: 10px; font-family: inherit; }
.field {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 11px 14px; border-top: 0.5px solid var(--separator);
}
.field:first-child { border-top: none; }
.field .value { font-variant-numeric: tabular-nums; color: var(--label-2); }
.field.block { display: block; }
.code {
  font-size: 44px; font-weight: 700; letter-spacing: 0.14em;
  font-variant-numeric: tabular-nums; text-align: center; padding: 6px 0 2px;
}
.dots { display: flex; justify-content: center; gap: 15px; padding: 26px 0 10px; }
.dots i { width: 13px; height: 13px; border-radius: 50%; background: var(--fill); }
.dots i.on { background: var(--accent); }
.mark {
  width: 64px; height: 64px; border-radius: 16px; margin: 0 auto;
  background: var(--accent); color: #F4F1EA;
  display: grid; place-items: center; font-size: 36px; font-weight: 600;
}
.detail-amount { text-align: center; padding: 10px 0 2px; }
.detail-amount .value { font-size: 44px; font-weight: 700; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
.detail-amount .what { font-size: 17px; color: var(--label-2); margin-top: 2px; }
.actions { display: grid; gap: 8px; padding: 14px 0 0; }
.danger { color: var(--expense); background: var(--surface); border: none; border-radius: 12px; padding: 14px; font: inherit; font-weight: 500; }

.hero { padding: 0 2px 8px; }
.month { display: grid; grid-template-columns: 1fr 1fr; }
.month .half { min-width: 0; }
.month .half + .half { border-left: 0.5px solid var(--separator); padding-left: 14px; }
.month .half:first-child { padding-right: 14px; }
.month .track { height: 6px; margin: 9px 0 7px; }
.amount-m {
  font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums; margin-top: 1px;
}
.month .forecast {
  grid-column: 1 / -1;
  margin-top: 12px; padding-top: 11px;
  border-top: 0.5px solid var(--separator);
  font-size: 14px; color: var(--label-2);
}
.month .forecast b { color: var(--label); font-weight: 600; white-space: nowrap; }

.nav-back { color: var(--accent); font-size: 17px; padding: 4px 2px 0; }
.note { font-size: 13px; color: var(--label-2); margin-top: 9px; }
.pill {
  background: var(--accent-soft); color: var(--accent);
  border: none; border-radius: 999px; padding: 10px 14px;
  font-family: inherit; font-size: 15px; font-weight: 500;
}
.savebars {
  position: relative;
  display: flex; align-items: flex-end; gap: 6px;
  height: 104px; padding-top: 10px;
}
.savebars > div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 3px; }
.savebars u { display: block; border-radius: 2px; background: var(--accent); }
.savebars u.plan { background: var(--accent-soft); border: 1px dashed var(--accent); }
.savebars span { font-size: 9px; color: var(--label-3); text-align: center; }
.savebars i { position: absolute; left: 0; right: 0; bottom: 63%; border-top: 1px dashed var(--label-3); }

@media (max-width: 520px) {
  body { padding: 0; background: #000; }
  .board-title { display: none; }
  .board { gap: 0; }
  .device {
    width: 100vw;
    height: 100dvh;
    padding: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .screen { border-radius: 0; }
  figcaption { display: none; }
}
</style>
</head>
<body>

<div class="board-title">
  <h1>Кубышка — прототип экранов</h1>
  <p>Данные вымышленные. Экран ввода работает: наберите сумму и выберите категорию.</p>
</div>

<main class="board">

  <!-- 1. Главная -->
  <figure>
    <div class="device"><div class="screen">
      <div class="status"><span>9:41</span><span>5G ▮</span></div>
      <div class="body">
        <div class="title-row">
          <h2>Ноябрь</h2>
          <div class="people">
            <i style="background:#15724C">А</i>
            <i style="background:#7D5BA6">М</i>
          </div>
        </div>

        <div class="hero">
          <span class="caption">Все счета</span>
          <div class="amount-xl">312 480 Br</div>
        </div>

        <div class="card month">
          <div class="half">
            <span class="caption">Потрачено</span>
            <div class="amount-m">62 400 Br</div>
            <div class="track"><b style="width:52%;background:var(--label-2)"></b><u style="left:63%"></u></div>
            <span class="caption">из 120 000 Br</span>
          </div>
          <div class="half">
            <span class="caption">Отложено</span>
            <div class="amount-m">79 600 Br</div>
            <div class="track"><b style="width:100%;background:var(--accent)"></b></div>
            <span class="caption">норма 40 000 Br</span>
          </div>
          <p class="forecast">К 30 ноября при таком темпе отложится <b>43 500 Br</b></p>
        </div>

        <div class="insights">
          <div class="insight">
            <h4>Кафе: 8 900 Br из 9 000 Br</h4>
            <p>При таком темпе лимит кончится 23 ноября</p>
          </div>
          <div class="insight anomaly">
            <h4>Транспорт: 6 100 Br</h4>
            <p>В 1,7 раза больше, чем обычно за месяц</p>
          </div>
        </div>

        <div class="section-head">
          <h3>Последние</h3>
          <a href="#">Все</a>
        </div>
        <div class="list">
          <div class="op">
            <div class="ic" style="background:#15724C1A">🛒</div>
            <div class="txt"><b>Продукты</b><span>Тинькофф, Аня</span></div>
            <div class="sum">−2 480 Br</div>
          </div>
          <div class="op">
            <div class="ic" style="background:#B074001A">☕️</div>
            <div class="txt"><b>Кафе</b><span>Наличные, Миша</span></div>
            <div class="sum">−640 Br</div>
          </div>
          <div class="op">
            <div class="ic" style="background:#15724C1A">💼</div>
            <div class="txt"><b>Зарплата</b><span>Альфа, Аня</span></div>
            <div class="sum in">+142 000 Br</div>
          </div>
        </div>
      </div>
      <nav class="tabbar">
        <div class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-6 8 6v8a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z"/></svg>Главная</div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Операции</div>
        <div><div class="fab">+</div></div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19V9M12 19V5M19 19v-7"/></svg>Аналитика</div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10l1.4 1.4m0-12.8l-1.4 1.4m-10 10l-1.4 1.4"/></svg>Ещё</div>
      </nav>
    </div></div>
    <figcaption>Главная</figcaption>
  </figure>

  <!-- 2. Ввод -->
  <figure>
    <div class="device"><div class="screen">
      <div class="status"><span>9:41</span><span>5G ▮</span></div>
      <div class="body" style="opacity:.35">
        <div class="title-row"><h2>Ноябрь</h2></div>
        <div class="card"><span class="caption">Все счета</span><div class="amount-xl">312 480 Br</div></div>
      </div>
      <div class="sheet">
        <div class="grabber"></div>
        <div class="segmented">
          <span class="on">Расход</span><span>Доход</span><span>Перевод</span>
        </div>
        <div class="entry-amount">
          <div class="value" id="value">1 240<i> Br</i></div>
          <div class="meta">Тинькофф, сегодня ⌄</div>
        </div>
        <div class="chips" id="chips">
          <button class="chip"><em>🛒</em>Продукты</button>
          <button class="chip"><em>☕️</em>Кафе</button>
          <button class="chip"><em>🚕</em>Транспорт</button>
          <button class="chip"><em>🏠</em>Дом</button>
          <button class="chip"><em>💊</em>Аптека</button>
          <button class="chip other">Другое</button>
        </div>
        <div class="keypad" id="keypad">
          <button>1</button><button>2</button><button>3</button>
          <button>4</button><button>5</button><button>6</button>
          <button>7</button><button>8</button><button>9</button>
          <button>,</button><button>0</button><button data-del>⌫</button>
        </div>
        <div class="toast" id="toast">
          <span id="toast-text">Продукты, 1 240 Br</span>
          <button>Отменить</button>
        </div>
      </div>
    </div></div>

<script>
const valueEl = document.getElementById('value');
const toast = document.getElementById('toast');
const toastText = document.getElementById('toast-text');
let digits = '1240';

const format = (raw) => raw ? Number(raw).toLocaleString('ru-RU') : '0';
const render = () => { valueEl.innerHTML = format(digits) + '<i> Br</i>'; };

document.getElementById('keypad').addEventListener('click', (e) => {
  const key = e.target.closest('button');
  if (!key) return;
  digits = key.dataset.del !== undefined ? digits.slice(0, -1) : (digits + key.textContent.trim()).replace(/\D/g, '').slice(0, 9);
  render();
});

document.getElementById('chips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip || !digits) return;
  toastText.textContent = chip.textContent.trim() + ', ' + format(digits) + ' Br';
  toast.classList.add('show');
  digits = '';
  render();
  clearTimeout(toast.dataset.timer);
  toast.dataset.timer = setTimeout(() => toast.classList.remove('show'), 2600);
});
</script>
