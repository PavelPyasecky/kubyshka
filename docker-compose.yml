name: kubyshka

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kubyshka
      POSTGRES_DB: kubyshka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kubyshka']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://kubyshka:${POSTGRES_PASSWORD}@db:5432/kubyshka
      SETUP_CODE: ${SETUP_CODE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ['sh', '-c']
    command:
      - |
        while true; do
          pg_dump -h db -U kubyshka kubyshka | gzip > /backups/kubyshka-$$(date +%F).sql.gz
          ls -1t /backups/*.sql.gz | tail -n +15 | xargs -r rm
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
  caddy-data:
  caddy-config:
